[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# manager-report checks the actual time itself (see the file) — this
# schedule just needs to run often enough to land inside its 15-minute
# window once a day (must match REPORT_WINDOW_MINUTES in that file).
# Restricted to 8-10am UTC (not all day) to avoid burning a function
# invocation every 15 minutes around the clock for no reason — that range
# covers 09:30 Europe/London in both GMT (=09:30 UTC) and BST (=08:30 UTC)
# with an hour's margin either side, cutting ~96 invocations/day to ~12.
[functions."manager-report"]
  schedule = "*/15 8-10 * * *"

# outreach-overdue-alert checks whether anyone on outreach is 15+ minutes
# overdue and, unlike manager-report, has to actually run repeatedly all
# working day — overdue events aren't tied to one moment. Windowed to
# roughly 6am-8pm UTC (covers ~7am-9pm BST / 6am-8pm GMT, a reasonable
# outreach working day with margin) rather than around the clock, same
# invocation-budget reasoning as manager-report's window above. Widen or
# narrow this if outreach regularly happens outside it.
[functions."outreach-overdue-alert"]
  schedule = "*/15 6-19 * * *"
